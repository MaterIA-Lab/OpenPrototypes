name: Sync project submodules

# Moves every projects/op-* submodule pointer to the latest commit of its
# default branch, so the root repository follows the live research.

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --init --remote

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.3

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "openprototypes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync project submodules"
          git push
