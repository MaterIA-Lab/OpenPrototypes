# Source of truth for OpenPrototypes projects.
# After editing, run: python scripts/build_index.py
# (CI also runs it on every push to main and once a day.)
#
# Fields:
#   id        (required) short kebab-case name; the repo is MaterIA-Lab/op-<id>
#   title     (required) human-readable title
#   status    (required) proposed | approved | active | paused | done | failed | abandoned
#   goal      (required) one-sentence research goal
#   repo      (optional) GitHub "owner/name"; leave out until the repository exists
#   path      (optional) submodule path, e.g. projects/op-<id>; leave out until the submodule is added
#   started   (optional) YYYY-MM-DD
#   tags      (optional) list of strings

projects:
  - id: supersort
    title: SuperSort
    status: active
    goal: >-
      Research practical architecture-aware CPU sorting for numeric types and objects,
      with reproducible comparisons to competitive reference implementations.
    repo: MaterIA-Lab/op-supersort
    path: projects/op-supersort
    tags: [performance, sorting, cpu, algorithms]
